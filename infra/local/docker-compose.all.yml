include:
  - docker-compose.yml

services:
  backend:
    container_name: backend
    build:
      context: ../../project
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - rabbitmq
    env_file:
      - ../../project/apps/backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql://postgres@postgres:5432/exam-flash-sales-system
      CACHE_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-secret}
      COOKIE_SECRET: ${COOKIE_SECRET:-secret}
      PINO_LOG_LEVEL: ${PINO_LOG_LEVEL:-info}
      LOKI_HOST: http://loki:3100
      SKIP_LOGIN: ${SKIP_LOGIN:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://backend:8000/ping >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  order-workers:
    container_name: order-workers
    build:
      context: ../../project
      dockerfile: services/order-workers/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - rabbitmq
    env_file:
      - ../../project/services/order-workers/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres@postgres:5432/exam-flash-sales-system
      CACHE_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      PINO_LOG_LEVEL: ${PINO_LOG_LEVEL:-info}
      LOKI_HOST: http://loki:3100
      ORDER_QUEUE_PREFETCH: ${ORDER_QUEUE_PREFETCH:-10}

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ../../project/tools/stress-test/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../project/tools/stress-test/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.2.2
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.2.2
    depends_on:
      - loki
    command: [ "-config.file=/etc/promtail/promtail.yml" ]
    volumes:
      - ../../project/tools/stress-test/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  k6:
    image: grafana/k6:1.0.0
    profiles:
      - stress
    depends_on:
      backend:
        condition: service_healthy
      prometheus:
        condition: service_started
    env_file:
      - ../../project/tools/stress-test/.env
    working_dir: /scripts
    volumes:
      - ../../project/tools/stress-test/scripts/stress-test.js:/scripts/stress-test.js:ro
    environment:
      API_BASE_URL: http://backend:8000
      STRESS_SCENARIO: ${STRESS_SCENARIO:-flash-sale}
      STRESS_VUS: ${STRESS_VUS:-100}
      STRESS_REQUESTS: ${STRESS_REQUESTS:-1000}
      STRESS_MAX_DURATION: ${STRESS_MAX_DURATION:-2m}
      STRESS_THINK_TIME_SECONDS: ${STRESS_THINK_TIME_SECONDS:-0}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://prometheus:9090/api/v1/write}
    command: [ "run", "-o", "experimental-prometheus-rw", "stress-test.js" ]

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
